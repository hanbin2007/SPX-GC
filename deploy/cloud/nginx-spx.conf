map $http_upgrade $ographic_spx_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $ographic_spx_bad_origin {
    default 1;
    '' 0;
    'https://spx.origenclub.cn' 0;
}

map "$http_sec_fetch_site:$uri" $ographic_spx_bad_fetch_site {
    default 0;
    ~^(cross-site|same-site): 1;
    'cross-site:/' 0;
    'same-site:/' 0;
}

server {
    listen 80;
    server_name spx.origenclub.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name spx.origenclub.cn;

    ssl_certificate /etc/letsencrypt/live/spx.origenclub.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spx.origenclub.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic 'SPX Graphics';
    auth_basic_user_file /etc/nginx/ographic-spx.htpasswd;

    if ($ographic_spx_bad_origin) { return 403; }
    if ($ographic_spx_bad_fetch_site) { return 403; }

    client_max_body_size 32m;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:5658;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ographic_spx_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location ~ /\. { return 404; }
}
