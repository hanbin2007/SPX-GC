<!DOCTYPE html>
<html lang="zh-CN">
<!--
  CRYSTAL 晶华新闻 · TICKER 滚动字幕                  SPX web layer 2
  Reserves the bottom band (lower thirds and fullscreen lift to clear it).
  Station cap, crimson label, conveyor text, glass clock. See README.md.
-->
<head>
  <meta charset="utf-8">
  <title>晶华新闻 · 滚动字幕</title>
  <link rel="stylesheet" href="./_scene/scene.css">
  <style>
    .tk-band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 36px;
      height: 56px;
      display: flex;
      align-items: stretch;
    }
    .tk-body {
      position: absolute;
      inset: 0;
      opacity: .96;
      clip-path: inset(0 100% 0 0);
    }
    .tk-rule {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: -3px;
      height: 3px;
      transform: scaleX(0);
      transform-origin: 0 50%;
    }
    .tk-band > .cr-flare { top: -1.5px; --run: 1920px; }

    .tk-cap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      clip-path: inset(0 100% 0 0);
    }
    .tk-brand { padding: 0 26px 0 var(--nl-safe-x); font-size: 24px; font-weight: 700; letter-spacing: .14em; }
    .tk-brand .cr-star { width: 26px; height: 26px; }
    .tk-label { padding: 0 26px; font-size: 26px; font-weight: 700; letter-spacing: .16em; }
    .tk-label .nl-swap { height: 56px; line-height: 56px; }
    .tk-clock {
      padding: 0 var(--nl-safe-x) 0 26px;
      font-family: "NL Latin";
      font-size: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: width var(--t-morph) var(--ease-out);
    }
    .tk-clock .nl-swap { height: 56px; line-height: 56px; }
    .tk-clock .tk-t { gap: 0; }
    .no-clock .tk-clock { display: none; }
    .tk-t { display: flex; align-items: center; gap: 12px; opacity: 0; transform: translate3d(0, 30%, 0); }

    .tk-viewport {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow: hidden;
      opacity: 0;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 36px, #000 calc(100% - 48px), transparent);
              mask-image: linear-gradient(90deg, transparent 0, #000 36px, #000 calc(100% - 48px), transparent);
    }
    .tk-track {
      position: absolute;
      left: 0;
      top: 0;
      height: 56px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      transition: opacity var(--t-swap) var(--ease-out);
    }
    .tk-item {
      flex: none;
      color: #fff;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: .03em;
      text-shadow: var(--cr-text-shadow);
    }
    .tk-item::after {        /* gold star separator */
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      margin: 0 36px;
      vertical-align: 3px;
      background: linear-gradient(145deg, var(--cr-gold-hi), var(--cr-gold) 50%, #a5812f);
      clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    }
    .tk-flip {
      position: absolute;
      left: 36px;
      top: 0;
      height: 56px;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity var(--t-swap) var(--ease-out);
    }
    .tk-flip .nl-swap { height: 56px; line-height: 56px; color: #fff; font-size: 30px; font-weight: 500; letter-spacing: .03em; text-shadow: var(--cr-text-shadow); }
    .is-flip .tk-track { opacity: 0; }
    .is-flip .tk-flip { opacity: 1; }

    /* ---- shown ---- */
    .nl-root[data-show="1"] .tk-rule { transform: scaleX(1); }
    .nl-root[data-show="1"] .tk-body,
    .nl-root[data-show="1"] .tk-cap { clip-path: inset(0 0 0 0); }
    .nl-root[data-show="1"] .tk-t { opacity: 1; transform: translate3d(0, 0, 0); }
    .nl-root[data-show="1"] .tk-viewport { opacity: 1; }

    .nl-root[data-show="1"][data-motion="enter"] .tk-rule { transition: transform 720ms var(--ease-out); }
    .nl-root[data-show="1"][data-motion="enter"] .cr-flare { animation: cr-flare 720ms var(--ease-out) 1 both; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-body { transition: clip-path 760ms var(--ease-out) 60ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-brand { transition: clip-path 520ms var(--ease-out) 40ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-label { transition: clip-path 520ms var(--ease-out) 140ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-clock { transition: clip-path 520ms var(--ease-out) 520ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-t { transition: opacity 360ms linear 280ms, transform 560ms var(--ease-out) 280ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-clock .tk-t { transition-delay: 620ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-viewport { transition: opacity 560ms var(--ease-out) 420ms; }
    .nl-root[data-show="1"][data-motion="enter"] .tk-brand .cr-glint { animation: cr-glint var(--t-glint) var(--ease-soft) 900ms 1 both; }

    /* ---- exit ---- */
    .nl-root[data-show="0"] .tk-viewport,
    .nl-root[data-show="0"] .tk-t { transition: opacity 180ms linear, transform 0s linear 600ms; }
    .nl-root[data-show="0"] .tk-clock { transition: clip-path 280ms var(--ease-in); }
    .nl-root[data-show="0"] .tk-label { transition: clip-path 280ms var(--ease-in) 80ms; }
    .nl-root[data-show="0"] .tk-brand { transition: clip-path 280ms var(--ease-in) 160ms; }
    .nl-root[data-show="0"] .tk-body { transition: clip-path 420ms var(--ease-in) 40ms; }
    .nl-root[data-show="0"] .tk-rule { transition: transform 420ms var(--ease-in) 120ms; }
  </style>
  <script>
    window.SPXGCTemplateDefinition = {
      description: "晶华 CRYSTAL 滚动字幕 TICKER",
      playserver: "-",
      playchannel: "1",
      playlayer: "12",
      webplayout: "2",
      steps: "1",
      out: "manual",
      dataformat: "json",
      uicolor: "2",
      DataFields: [
        { field: "f0", ftype: "textarea", title: "字幕内容（每行一条）", value: "国家统计局发布前三季度国民经济运行数据\n多地出台举措支持城市更新与老旧小区改造\n秋粮收获进度过半，主产区天气总体有利\n全国铁路国庆假期累计发送旅客超一亿五千万人次" },
        { field: "f1", ftype: "textfield", title: "标签", value: "快讯" },
        {
          field: "f2", ftype: "dropdown", title: "模式", value: "scroll",
          items: [ { text: "滚动", value: "scroll" }, { text: "翻页", value: "flip" } ]
        },
        {
          field: "f3", ftype: "dropdown", title: "速度", value: "140",
          items: [ { text: "慢", value: "100" }, { text: "标准", value: "140" }, { text: "快", value: "180" } ]
        },
        { field: "f4", ftype: "checkbox", title: "右侧时钟", value: "1" },
        {
          field: "f5", ftype: "dropdown", title: "时区", value: "Asia/Shanghai",
          items: [
            { text: "北京 / 上海", value: "Asia/Shanghai" },
            { text: "本机时间", value: "local" },
            { text: "香港", value: "Asia/Hong_Kong" },
            { text: "东京", value: "Asia/Tokyo" },
            { text: "伦敦", value: "Europe/London" },
            { text: "纽约", value: "America/New_York" },
            { text: "UTC", value: "UTC" }
          ]
        },
        { ftype: "instruction", value: "字幕条上屏时标题条 / 人名条 / 全屏图文自动上移让出空间。播出中更新内容会在队尾无缝接续。" }
      ]
    };
  </script>
</head>
<body>
  <main class="nl-stage" id="stage">
    <section class="nl-root tk" id="root">
      <div class="tk-band">
        <div class="tk-body cr-glass cr-glass--deep"></div>
        <div class="tk-cap tk-brand cr-glass"><span class="tk-t"><i class="cr-star"></i><span>晶华新闻</span></span><i class="cr-glint"></i></div>
        <div class="tk-cap tk-label cr-glass cr-glass--red"><span class="tk-t"><span class="nl-swap" id="label"></span></span></div>
        <div class="tk-viewport" id="viewport">
          <div class="tk-track" id="track"></div>
          <div class="tk-flip"><span class="nl-swap" id="flip"></span></div>
        </div>
        <div class="tk-cap tk-clock cr-glass"><span class="tk-t"><span class="nl-swap" id="h1"></span><span class="nl-swap" id="h2"></span><span>:</span><span class="nl-swap" id="m1"></span><span class="nl-swap" id="m2"></span></span></div>
        <i class="tk-rule cr-gold"></i>
        <i class="cr-flare"></i>
      </div>
    </section>
  </main>

  <script src="./_scene/scene.js"></script>
  <script>
    (function () {
      const C = window.Crystal;
      if (!C) return;                       // SPX template import (JSDOM) only reads the definition
      const $ = (id) => document.getElementById(id);
      const root = $("root");
      const view = $("viewport");
      const track = $("track");
      C.stage($("stage"));

      const FLIP_DWELL = 6000;
      let items = [];
      let mode = "scroll";
      let speed = 140;
      let zone = "Asia/Shanghai";

      /* ---- conveyor: nodes leave on the left, new ones join on the right ---- */
      let queue = [], cursor = 0, x = 0, total = 0, raf = 0, last = 0;
      function append() {
        if (!items.length) return false;
        const node = document.createElement("span");
        node.className = "tk-item";
        node.textContent = items[cursor % items.length];
        cursor += 1;
        track.appendChild(node);
        const width = node.offsetWidth;
        queue.push({ node, width });
        total += width;
        return true;
      }
      function fill() {
        const need = view.clientWidth + 480;
        for (let guard = 0; x + total < need && guard < 60; guard += 1) if (!append()) break;
      }
      function reset() {
        track.textContent = "";
        queue = []; total = 0; cursor = 0;
        x = 36;
        track.style.transform = `translate3d(${x}px,0,0)`;
      }
      function tick(t) {
        const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
        last = t;
        x -= speed * dt;
        while (queue.length && x + queue[0].width < 0) {
          const first = queue.shift();
          x += first.width; total -= first.width;
          first.node.remove();
        }
        fill();
        track.style.transform = `translate3d(${x.toFixed(2)}px,0,0)`;
        raf = requestAnimationFrame(tick);
      }
      function run(on) {
        cancelAnimationFrame(raf); raf = 0; last = 0;
        if (on && mode === "scroll") raf = requestAnimationFrame(tick);
      }

      /* ---- flip ---- */
      let flipTimer = 0, flipIndex = 0;
      function flipTo(i, animate) {
        if (!items.length) { C.swap($("flip"), "", { animate }); return; }
        flipIndex = i % items.length;
        C.swap($("flip"), items[flipIndex], { animate, fit: { max: view.clientWidth - 90, size: 30, min: 24 } });
      }
      function flipRun(on) {
        clearInterval(flipTimer);
        if (on && mode === "flip") flipTimer = setInterval(() => flipTo(flipIndex + 1, true), FLIP_DWELL);
      }

      /* ---- clock ---- */
      let clockTimer = 0;
      function now() {
        const opts = { hour: "2-digit", minute: "2-digit", hour12: false };
        if (zone !== "local") opts.timeZone = zone;
        try { return new Intl.DateTimeFormat("en-GB", opts).format(new Date()).replace(/[^0-9]/g, ""); }
        catch (e) { return new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()).replace(/[^0-9]/g, ""); }
      }
      function drawClock(animate) {
        const t = now().padStart(4, "0").slice(-4);
        ["h1", "h2", "m1", "m2"].forEach((id, i) => C.swap($(id), t[i], { animate }));
      }

      C.define({
        kind: "ticker",
        root,
        enterMs: 2200,
        exitMs: 620,
        enterDelay: C.T.room,
        releaseDelay: C.T.out,
        reserve: () => ({ bottom: 36 + 56 }),
        defaults: {
          f0: "国家统计局发布前三季度国民经济运行数据\n多地出台举措支持城市更新与老旧小区改造\n秋粮收获进度过半，主产区天气总体有利\n全国铁路国庆假期累计发送旅客超一亿五千万人次",
          f1: "快讯", f2: "scroll", f3: "140", f4: "1", f5: "Asia/Shanghai"
        },
        render(d, ctx) {
          const animate = ctx.animate;
          C.swap($("label"), C.clean(d.f1) || "快讯", { animate });
          zone = C.clean(d.f5) || "local";
          root.classList.toggle("no-clock", String(d.f4) === "0");
          drawClock(animate);

          const nextItems = C.clean(d.f0).split("\n").map((s) => s.trim()).filter(Boolean);
          const changed = nextItems.join("\n") !== items.join("\n");
          items = nextItems;
          speed = Math.max(40, Number(d.f3) || 140);
          const nextMode = d.f2 === "flip" ? "flip" : "scroll";
          const modeChanged = nextMode !== mode;
          mode = nextMode;
          root.classList.toggle("is-flip", mode === "flip");

          if (!animate) { reset(); flipTo(0, false); return; }
          if (changed) cursor = 0;                               // joins at the next seam
          if (mode === "flip" && (changed || modeChanged)) { flipTo(0, true); flipRun(true); }
          if (modeChanged) {
            if (mode === "scroll") { reset(); run(true); } else { run(false); }
            flipRun(true);
          }
        },
        onShow(shown, motion) {
          if (shown) {
            if (motion !== "cut") { reset(); flipTo(0, false); }
            drawClock(false);
            clearInterval(clockTimer);
            clockTimer = setInterval(() => drawClock(true), 1000);
            run(true);
            flipRun(true);
            return;
          }
          setTimeout(() => { if (!this.shown) { run(false); flipRun(false); clearInterval(clockTimer); } }, this.o.exitMs);
        }
      });
    })();
  </script>
</body>
</html>
