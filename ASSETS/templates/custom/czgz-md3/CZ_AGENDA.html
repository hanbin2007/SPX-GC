<!DOCTYPE html>
<html lang="zh-CN" class="cz-boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常州高级中学 · 议程卡</title>
  <link rel="stylesheet" href="./core/md3.css">
  <link rel="stylesheet" href="./gfx/agenda.css">
  <script>
    window.SPXGCTemplateDefinition = {
      description: "常高 M3 · 议程 / 节目单（Continue 逐项推进）",
      playserver: "-",
      playchannel: "1",
      playlayer: "10",
      webplayout: "1",
      steps: "10",
      out: "manual",
      dataformat: "json",
      uicolor: "5",
      DataFields: [
        { field: "f0", ftype: "textfield", title: "标题", value: "今日议程" },
        { field: "f1", ftype: "textfield", title: "副标题（可留空）", value: "2026年秋季学期开学典礼" },
        { field: "f2", ftype: "textarea", title: "项目（每行一项，可写“时间 | 内容”，最多 9 项）", value: "08:30 | 升国旗、奏唱国歌\n08:40 | 校长开学致辞\n09:00 | 优秀学生表彰\n09:20 | 教师代表发言\n09:35 | 新生代表发言\n09:50 | 校歌合唱" },
        { field: "f3", ftype: "number", title: "当前项（0 = 不高亮）", value: "1" },
        { field: "f4", ftype: "textfield", title: "标志组编号（school = 学校标志）", value: "1" },
        { ftype: "instruction", value: "播出后按 Continue 逐项推进高亮，已完成项自动打勾。与全屏卡共用第 1 层。" }
      ]
    };
  </script>
</head>
<body>
  <main class="stage" id="stage">
    <section class="ag" aria-label="议程">
      <div class="ag-card" id="card">
        <header class="ag-head" id="head">
          <div class="cz-badge ag-badge">
            <div class="cz-badge__shape" id="badgeShape"></div>
            <div class="cz-badge__art" id="badgeEmblem"></div>
          </div>
          <div class="ag-heading">
            <div class="cz-slot ag-title" id="title"></div>
            <div class="cz-slot ag-sub" id="sub"></div>
          </div>
          <div class="ag-count" id="count"><span class="cz-slot" id="countNow"></span><span class="cz-slot ag-count__of" id="countAll"></span></div>
        </header>
        <div class="ag-list" id="list">
          <div class="ag-indicator" id="indicator"><b id="indicatorPill"></b></div>
        </div>
      </div>
    </section>
  </main>
  <script src="./core/md3.js"></script>
  <script src="./gfx/agenda.js"></script>
</body>
</html>
