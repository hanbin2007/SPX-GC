<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常高 M3 包装 · 预览台</title>
  <link rel="stylesheet" href="./fonts/fonts.css">
  <style>
    :root {
      --navy: #1a3e71;
      --navy-ink: #0a1a33;
      --teal: #30b8bd;
      --teal-soft: #c8f1f2;
      --on-teal: #00302f;
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-high: #e6ebf3;
      --ink: #13223b;
      --ink-var: #4d5a6e;
      --outline: #d3dbe7;
      --live: #d93025;
      --font: "CZ Latin", "CZ Hans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body { padding: 0 24px 32px; }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 84px;
    }
    header img { width: 48px; height: 48px; padding: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(6 20 44 / 18%); }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--ink-var); letter-spacing: 0.04em; }
    header .spacer { flex: 1; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

    .monitor-card {
      padding: 16px;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgb(6 20 44 / 10%), 0 4px 16px rgb(6 20 44 / 6%);
    }

    .monitor {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }
    .monitor .canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 0 0;
    }
    .monitor iframe {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      border: 0;
      background: transparent;
    }
    .scene { position: absolute; inset: 0; transition: opacity 80ms linear; }

    /* Camera A: auditorium stage */
    .scene-a {
      background:
        radial-gradient(ellipse 22% 30% at 30% 8%, rgb(255 226 170 / 55%), transparent 70%),
        radial-gradient(ellipse 22% 30% at 70% 8%, rgb(255 226 170 / 45%), transparent 70%),
        radial-gradient(circle at 50% 62%, #9b3b3b 0, #5f1f25 30%, transparent 31%),
        linear-gradient(180deg, #2b1a1f 0%, #6a2c30 46%, #3a2428 58%, #8a6a52 58.3%, #5a4232 100%);
    }
    .scene-a::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 30%, rgb(255 210 150 / 35%) 0 22px, transparent 23px),
        radial-gradient(circle at 88% 26%, rgb(255 210 150 / 30%) 0 30px, transparent 31px),
        radial-gradient(circle at 20% 72%, rgb(255 255 255 / 10%) 0 60px, transparent 61px),
        radial-gradient(circle at 80% 76%, rgb(255 255 255 / 8%) 0 80px, transparent 81px);
      filter: blur(6px);
    }
    .scene-a::after {
      content: "";
      position: absolute;
      left: 34%;
      top: 36%;
      width: 32%;
      height: 26%;
      border-radius: 12px;
      background: linear-gradient(180deg, #d8c3a0, #a8865c);
      box-shadow: 0 30px 60px rgb(0 0 0 / 35%);
    }

    /* Camera B: sports field */
    .scene-b {
      background:
        repeating-linear-gradient(172deg, transparent 0 58px, rgb(255 255 255 / 55%) 58px 62px) 0 62% / 100% 38% no-repeat,
        linear-gradient(180deg, #8fbfe6 0%, #d9ecf7 40%, #6fa66a 40.2%, #4f8a4c 55%, #b85a44 55.2%, #a44b37 100%);
    }
    .scene-b::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      height: 10%;
      background: linear-gradient(180deg, #c9d3dc, #9aa8b4);
      clip-path: polygon(0 60%, 8% 30%, 16% 55%, 26% 20%, 38% 50%, 50% 25%, 62% 45%, 74% 15%, 86% 50%, 100% 30%, 100% 100%, 0 100%);
    }

    .scene-c {
      background: repeating-conic-gradient(#d7dce3 0 25%, #f4f6f9 0 50%) 0 0 / 48px 48px;
    }

    .safe {
      position: absolute;
      inset: 54px 96px;
      border: 2px dashed rgb(255 255 255 / 65%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms var(--ease);
    }
    .safe.on { opacity: 1; }

    .monitor-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    .monitor-bar .label { margin-right: 4px; font-size: 13px; color: var(--ink-var); }

    .chip {
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--outline);
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: 600 14px var(--font);
      cursor: pointer;
      transition: background-color 160ms var(--ease), border-color 160ms var(--ease);
    }
    .chip[aria-pressed="true"] { border-color: transparent; background: var(--teal-soft); color: var(--on-teal); }
    .chip:hover { background: var(--surface-high); }
    .chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .note {
      margin: 14px 2px 0;
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink-var);
    }

    .panel { display: grid; gap: 12px; }

    .ctl {
      padding: 16px 16px 14px 18px;
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgb(6 20 44 / 10%);
      transition: box-shadow 200ms var(--ease);
    }
    .ctl.is-on { box-shadow: inset 0 0 0 2px var(--teal), 0 1px 2px rgb(6 20 44 / 10%); }

    .ctl-head { display: flex; align-items: center; gap: 10px; }
    .ctl-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .ctl-head .layer {
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--surface-high);
      font-size: 12px;
      font-weight: 700;
      line-height: 24px;
      color: var(--ink-var);
    }
    .ctl-head .dot {
      width: 10px;
      height: 10px;
      margin-left: auto;
      border-radius: 50%;
      background: var(--outline);
      transition: background-color 200ms var(--ease);
    }
    .ctl.is-on .dot { background: var(--live); }
    .ctl p { margin: 6px 0 12px; font-size: 13px; color: var(--ink-var); }

    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      font: 600 14px var(--font);
      cursor: pointer;
      transition: border-radius 220ms var(--ease), filter 160ms var(--ease);
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { border-radius: 10px; }
    .btn.play { background: var(--navy); color: #fff; }
    .btn.tonal { background: var(--teal-soft); color: var(--on-teal); }
    .btn.out { background: var(--surface-high); color: var(--ink); }
    .btn.danger { background: #ffdad6; color: #410002; }
  </style>
</head>
<body>
  <header>
    <img src="./img/emblem.png" alt="">
    <div>
      <h1>常高直播包装 · 预览台</h1>
      <p>Material 3 Expressive · SPX Graphics Controller 模板包</p>
    </div>
    <span class="spacer"></span>
    <button class="btn danger" id="clearAll" type="button">全部清除</button>
  </header>

  <div class="layout">
    <section class="monitor-card">
      <div class="monitor" id="monitor">
        <div class="canvas" id="canvas">
          <div class="scene scene-a" id="scene"></div>
          <iframe id="layer1" title="第 1 层"></iframe>
          <iframe id="layer2" title="第 2 层"></iframe>
          <iframe id="layer3" title="第 3 层"></iframe>
          <iframe id="layer4" title="第 4 层"></iframe>
          <iframe id="layer5" title="第 5 层"></iframe>
          <div class="safe" id="safe"></div>
        </div>
      </div>
      <div class="monitor-bar">
        <span class="label">背景</span>
        <button class="chip" type="button" data-scene="a" aria-pressed="true">机位 A · 礼堂</button>
        <button class="chip" type="button" data-scene="b" aria-pressed="false">机位 B · 操场</button>
        <button class="chip" type="button" data-scene="c" aria-pressed="false">透明棋盘格</button>
        <span class="spacer" style="flex:1"></span>
        <button class="chip" type="button" id="safeToggle" aria-pressed="false">安全框</button>
      </div>
      <p class="note">
        与 SPX 渲染器一致：每次“播出”都会重新载入该层模板再 update + play。同层连续播出同类图文（人名条 ⇄ 标题条、两张全屏卡）会从上一条无缝形变过去；
        播出中点“更新”走原地形变。滚动字幕在播时人名条自动上移；全屏卡在播时角标自动隐藏；转场在完全遮挡的一刻会自动切换机位 A/B 背景，演示切机时机。
      </p>
    </section>

    <aside class="panel" id="panel"></aside>
  </div>

  <script>
    const GRAPHICS = [
      {
        id: "bug", name: "台标角标", file: "CZ_BUG.html", layer: 4,
        desc: "校徽 + 校名 + 直播状态 + 时钟",
        samples: [
          { f0: "live", f1: "", f2: "1", f3: "1" },
          { f0: "live", f1: "第68届田径运动会", f2: "1", f3: "1" },
          { f0: "replay", f1: "开学典礼", f2: "0", f3: "1" }
        ]
      },
      {
        id: "name", name: "人名条", file: "CZ_NAME.html", layer: 2,
        desc: "与标题条同层，互相无缝形变",
        samples: [
          { f0: "张明远", f1: "高二（3）班 · 学生会主席", f2: "主持人", f3: "left" },
          { f0: "李思涵", f1: "高三（12）班 · 校辩论队队长", f2: "正方一辩", f3: "left" },
          { f0: "王浩然", f1: "高三（5）班 · 校辩论队", f2: "反方一辩", f3: "right" },
          { f0: "陈立群", f1: "江苏省常州高级中学 校长", f2: "", f3: "left" }
        ]
      },
      {
        id: "caption", name: "标题条", file: "CZ_CAPTION.html", layer: 2,
        desc: "栏目色块 + 主副标题",
        samples: [
          { f0: "开学典礼", f1: "2026年秋季学期开学典礼暨表彰大会", f2: "学校体育馆 · 全校师生共同参与" },
          { f0: "赛况", f1: "男子100米决赛即将开始", f2: "" },
          { f0: "", f1: "高一新生军训汇报表演", f2: "东操场 · 下午两点" }
        ]
      },
      {
        id: "ticker", name: "滚动字幕", file: "CZ_TICKER.html", layer: 3,
        desc: "更新后新内容无缝接在后面",
        samples: [
          { f0: "校园快讯", f1: "欢迎收看江苏省常州高级中学直播\n第六十八届田径运动会今日上午八时开幕\n高一新生军训汇报表演将于下午两点举行\n本场直播由校学生会融媒体中心制作", f2: "normal" },
          { f0: "赛况速报", f1: "男子100米决赛：高二（5）班王浩 11秒32 夺冠\n女子跳远：高一（8）班陈雨桐 5米21 打破校纪录\n4×400米接力决赛将于15:40进行", f2: "normal" }
        ]
      },
      {
        id: "agenda", name: "议程卡", file: "CZ_AGENDA.html", layer: 1, next: true,
        desc: "“下一步”逐项推进高亮（对应 SPX Continue）",
        samples: [
          { f0: "今日议程", f1: "2026年秋季学期开学典礼", f2: "08:30 | 升国旗、奏唱国歌\n08:40 | 校长开学致辞\n09:00 | 优秀学生表彰\n09:20 | 教师代表发言\n09:35 | 新生代表发言\n09:50 | 校歌合唱", f3: "1" },
          { f0: "文艺汇演", f1: "元旦晚会节目单", f2: "舞蹈《青春纪》\n合唱《少年》\n相声《开学第一课》\n话剧《1907》\n乐队《夜空中最亮的星》", f3: "2" }
        ]
      },
      {
        id: "fullscreen", name: "全屏卡", file: "CZ_FULLSCREEN.html", layer: 1,
        desc: "即将开始 / 中场休息 / 感谢观看",
        samples: [
          { f0: "starting", f1: "江苏省常州高级中学\n第六十八届田径运动会", f2: "2026年10月18日 · 学校田径场", f3: "countdown", f4: "", f5: "5", f6: "dark", f7: "" },
          { f0: "break", f1: "精彩稍后继续", f2: "下半场：男女4×400米接力决赛", f3: "time", f4: "", f5: "", f6: "dark", f7: "" },
          { f0: "end", f1: "感谢收看本次直播", f2: "江苏省常州高级中学融媒体中心", f3: "emblem", f4: "", f5: "", f6: "light", f7: "" }
        ]
      },
      {
        id: "transition", name: "转场", file: "CZ_TRANSITION.html", layer: 5, oneShot: true,
        desc: "约 0.7 秒完全遮挡，此刻切机位",
        samples: [
          { f0: "normal", f1: "1" },
          { f0: "short", f1: "0" }
        ]
      }
    ];

    const canvas = document.getElementById("canvas");
    const monitor = document.getElementById("monitor");
    const scene = document.getElementById("scene");
    const panel = document.getElementById("panel");
    const layerOwner = {};   // layer -> graphic id currently loaded
    const state = {};        // id -> { sample, on }

    function fitCanvas() {
      canvas.style.transform = `scale(${monitor.clientWidth / 1920})`;
    }
    new ResizeObserver(fitCanvas).observe(monitor);

    function frame(layer) {
      return document.getElementById(`layer${layer}`);
    }

    function setOn(id, on) {
      state[id].on = on;
      document.getElementById(`ctl-${id}`).classList.toggle("is-on", on);
    }

    function play(g) {
      const s = state[g.id];
      const f = frame(g.layer);
      const prev = layerOwner[g.layer];
      if (prev && prev !== g.id) setOn(prev, false);
      layerOwner[g.layer] = g.id;
      f.onload = () => {
        f.onload = null;
        f.contentWindow.update(JSON.stringify(g.samples[s.sample]));
        f.contentWindow.play();
      };
      f.src = `${g.file}?random=${Date.now()}`;
      if (g.oneShot) {
        setOn(g.id, true);
        setTimeout(() => setOn(g.id, false), 2600);
      } else {
        setOn(g.id, true);
      }
    }

    function call(g, fn, data) {
      if (layerOwner[g.layer] !== g.id) return;
      const w = frame(g.layer).contentWindow;
      if (w && typeof w[fn] === "function") data === undefined ? w[fn]() : w[fn](data);
    }

    function update(g) {
      const s = state[g.id];
      s.sample = (s.sample + 1) % g.samples.length;
      document.getElementById(`sample-${g.id}`).textContent = `示例 ${s.sample + 1}/${g.samples.length}`;
      call(g, "update", JSON.stringify(g.samples[s.sample]));
    }

    function stop(g) {
      call(g, "stop");
      setOn(g.id, false);
    }

    for (const g of GRAPHICS) {
      state[g.id] = { sample: 0, on: false };
      const card = document.createElement("section");
      card.className = "ctl";
      card.id = `ctl-${g.id}`;
      card.innerHTML = `
        <div class="ctl-head"><h2></h2><span class="layer">第 ${g.layer} 层</span><span class="dot" aria-hidden="true"></span></div>
        <p><span class="desc"></span> · <span id="sample-${g.id}">示例 1/${g.samples.length}</span></p>
        <div class="btns"></div>`;
      card.querySelector("h2").textContent = g.name;
      card.querySelector(".desc").textContent = g.desc;
      const btns = card.querySelector(".btns");
      const add = (label, cls, fn) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = `btn ${cls}`;
        b.textContent = label;
        b.addEventListener("click", fn);
        btns.appendChild(b);
      };
      add("播出", "play", () => play(g));
      if (!g.oneShot) add("更新", "tonal", () => update(g));
      if (g.next) add("下一步", "tonal", () => call(g, "next"));
      if (!g.oneShot) add("收起", "out", () => stop(g));
      else add("换示例", "tonal", () => update(g));
      panel.appendChild(card);
    }

    document.getElementById("clearAll").addEventListener("click", () => {
      for (const g of GRAPHICS) if (state[g.id].on) stop(g);
    });

    function setScene(key) {
      scene.className = `scene scene-${key}`;
      document.querySelectorAll("[data-scene]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.scene === key)));
    }
    document.querySelectorAll("[data-scene]").forEach((b) => b.addEventListener("click", () => setScene(b.dataset.scene)));

    const safe = document.getElementById("safe");
    document.getElementById("safeToggle").addEventListener("click", (e) => {
      const on = !safe.classList.contains("on");
      safe.classList.toggle("on", on);
      e.currentTarget.setAttribute("aria-pressed", String(on));
    });

    // The stinger reports full cover on the package bus: cut "cameras" there.
    try {
      const bus = new BroadcastChannel(`czmd3:pgm:${location.pathname}`);
      bus.onmessage = (event) => {
        if (event.data && event.data.type === "cover") {
          const cur = scene.classList.contains("scene-a") ? "a" : scene.classList.contains("scene-b") ? "b" : "c";
          if (cur !== "c") setScene(cur === "a" ? "b" : "a");
        }
      };
    } catch (error) { /* BroadcastChannel unavailable */ }
  </script>
</body>
</html>
