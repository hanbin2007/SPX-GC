<!DOCTYPE html>
<html lang="zh-CN" class="cz-boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常州高级中学 · 台标角标</title>
  <link rel="stylesheet" href="./core/md3.css">
  <link rel="stylesheet" href="./gfx/bug.css">
  <script>
    window.SPXGCTemplateDefinition = {
      description: "常高 M3 · 台标角标（标志轮播 + 直播状态 + 时钟）",
      playserver: "-",
      playchannel: "1",
      playlayer: "40",
      webplayout: "4",
      steps: "1",
      out: "manual",
      dataformat: "json",
      uicolor: "1",
      DataFields: [
        {
          field: "f0", ftype: "dropdown", title: "状态", value: "live",
          items: [
            { text: "直播 LIVE", value: "live" },
            { text: "回放 REPLAY", value: "replay" },
            { text: "录播 RECORDED", value: "record" },
            { text: "不显示", value: "none" }
          ]
        },
        { field: "f1", ftype: "textfield", title: "活动名称（可留空）", value: "" },
        { field: "f2", ftype: "checkbox", title: "显示时钟", value: "1" },
        { field: "f3", ftype: "checkbox", title: "显示名称（校名书法 / 标志文件名）", value: "1" },
        { ftype: "divider", title: "标志轮播" },
        { ftype: "instruction", value: "标志轮播：把 PNG / SVG / JPG 放进本模板的 logos 文件夹即可在下面选择，文件名就是显示名称（开头的“01-”等序号会被去掉）。放入新文件后刷新 SPX 页面。宽度明显大于高度的标志会用白色横条展示。" },
        { field: "f4", ftype: "checkbox", title: "包含学校标志", value: "1" },
        { field: "f5", ftype: "filelist", title: "标志 1", assetfolder: "./logos/", extension: "G", value: "" },
        { field: "f6", ftype: "filelist", title: "标志 2", assetfolder: "./logos/", extension: "G", value: "" },
        { field: "f7", ftype: "filelist", title: "标志 3", assetfolder: "./logos/", extension: "G", value: "" },
        { field: "f8", ftype: "filelist", title: "标志 4", assetfolder: "./logos/", extension: "G", value: "" },
        { field: "f9", ftype: "filelist", title: "标志 5", assetfolder: "./logos/", extension: "G", value: "" },
        { field: "f10", ftype: "filelist", title: "标志 6", assetfolder: "./logos/", extension: "G", value: "" },
        {
          field: "f11", ftype: "dropdown", title: "切换方式", value: "auto",
          items: [
            { text: "自动轮播", value: "auto" },
            { text: "手动", value: "manual" }
          ]
        },
        { field: "f12", ftype: "number", title: "轮播间隔（秒，最少 3）", value: "8" },
        { ftype: "button", title: "下一个标志", descr: "播出中立即切换", fcall: "(function(b){var r=b.closest('.itemrow');ajaxpost('/gc/playout',{command:'invoke',playserver:'-',webplayout:r?r.querySelector('input[name*=webplayout]').value:'4',function:'czLogoStep',params:'1'},'true');})(this)" },
        { ftype: "instruction", value: "全屏卡播出时角标自动隐藏，全屏卡收起后自动回来。" }
      ]
    };
  </script>
</head>
<body>
  <main class="stage" id="stage">
    <div class="bug-brand" aria-label="台标">
      <div class="bug-badgewrap" id="badgeWrap">
        <div class="cz-badge bug-badge">
          <div class="bug-spin"><div class="cz-badge__shape" id="badgeShape"></div></div>
          <div class="bug-art" id="art"></div>
        </div>
      </div>
      <div class="bug-seg bug-plate" id="plate"><div class="bug-plate__in"><div class="cz-slot" id="plateSlot"></div></div></div>
      <div class="bug-seg bug-event" id="event"><div class="cz-slot" id="eventSlot"></div></div>
    </div>
    <div class="bug-status" aria-label="直播状态">
      <div class="bug-seg bug-live" id="live" data-mode="live">
        <div class="bug-live__in" id="liveIn">
          <span class="cz-live-dot"></span>
          <span class="cz-slot bug-live__cn" id="liveCn"></span>
          <span class="cz-slot bug-live__en" id="liveEn"></span>
        </div>
      </div>
      <div class="bug-seg bug-clock" id="clock">
        <div class="bug-clock__in" id="clockIn">
          <span class="cz-slot" id="d0"></span><span class="cz-slot" id="d1"></span><span class="colon">:</span><span class="cz-slot" id="d2"></span><span class="cz-slot" id="d3"></span>
        </div>
      </div>
    </div>
  </main>
  <script src="./core/md3.js"></script>
  <script src="./gfx/bug.js"></script>
</body>
</html>
