<body>
  <main class="stage" id="stage">
    <div class="bug-brand" aria-label="台标">
      <div class="bug-badgewrap" id="badgeWrap">
        <div class="cz-badge bug-badge">
          <div class="bug-spin"><div class="cz-badge__shape" id="badgeShape"></div></div>
          <div class="bug-art" id="art"></div>
        </div>
      </div>
      <div class="bug-seg bug-plate" id="plate"><div class="bug-plate__in"><div class="cz-slot" id="plateSlot"></div></div></div>
      <div class="bug-seg bug-event" id="event"><div class="cz-slot" id="eventSlot"></div></div>
    </div>
    <div class="bug-status" aria-label="直播状态">
      <div class="bug-seg bug-live" id="live" data-mode="live">
        <div class="bug-live__in" id="liveIn">
          <span class="cz-live-dot"></span>
          <span class="cz-slot bug-live__cn" id="liveCn"></span>
          <span class="cz-slot bug-live__en" id="liveEn"></span>
        </div>
      </div>
      <div class="bug-seg bug-clock" id="clock">
        <div class="bug-clock__in" id="clockIn">
          <span class="cz-slot" id="d0"></span><span class="cz-slot" id="d1"></span><span class="colon">:</span><span class="cz-slot" id="d2"></span><span class="cz-slot" id="d3"></span>
        </div>
      </div>
    </div>
  </main>
  <script src="./core/md3.js"></script>
  <script src="./gfx/bug.js"></script>
</body>
