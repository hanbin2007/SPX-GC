<!DOCTYPE html>
<html lang="zh-CN" class="cz-boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常州高级中学 · 开场片头</title>
  <link rel="stylesheet" href="./core/md3.css">
  <link rel="stylesheet" href="./gfx/opener.css">
  <script>
    window.SPXGCTemplateDefinition = {
      description: "常高 M3 · 开场片头（约 10 秒：校园插画 + 校徽演绎）",
      playserver: "-",
      playchannel: "1",
      playlayer: "50",
      webplayout: "5",
      steps: "1",
      out: "manual",
      dataformat: "json",
      uicolor: "6",
      DataFields: [
        { field: "f0", ftype: "textfield", title: "标题（可留空）", value: "2026年秋季学期开学典礼" },
        { field: "f1", ftype: "textfield", title: "副标题（可留空）", value: "2026年9月1日 · 学校体育馆" },
        {
          field: "f2", ftype: "dropdown", title: "结束方式", value: "reveal",
          items: [
            { text: "自动揭开直播画面", value: "reveal" },
            { text: "停在校徽画面（点收起再揭开）", value: "hold" }
          ]
        },
        { ftype: "instruction", value: "盖在最上层（第 5 层）播放，播出时角标自动隐藏。“自动揭开”时片头结束后画面已回到直播，之后在 SPX 里点一下收起即可复位。中途点收起会立即揭开。" }
      ]
    };
  </script>
</head>
<body>
  <main class="stage" id="stage">
    <section class="op" id="op" aria-label="开场片头">
      <div class="op-deco" aria-hidden="true">
        <i class="op-halo"></i><i class="op-clover"></i><i class="op-sun8"></i><i class="op-dot"></i><i class="op-spark"></i>
      </div>
      <div class="op-ripples" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="op-rays" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="op-seed" id="seed"><i id="seedShape"></i></div>
      <div class="op-campus" id="campus">
        <div class="op-cam" id="cam"><i class="cz-wordmark op-stone-word" id="stoneWord"></i></div>
        <div class="op-year" id="year">
          <div class="cz-slot op-year__label" id="yearLabel"></div>
          <div class="op-year__digits" id="yearDigits"></div>
          <span class="op-year__range" id="yearRange"></span>
        </div>
      </div>
      <div class="op-emblem" id="emblem"></div>
      <div class="op-lockup" id="lockup">
        <i class="cz-wordmark op-word" id="word"></i>
        <div class="op-en" id="en">CHANGZHOU SENIOR HIGH SCHOOL OF JIANGSU PROVINCE</div>
        <i class="op-rule" id="rule"></i>
        <div class="cz-slot op-title" id="title"></div>
        <div class="cz-slot op-sub" id="sub"></div>
      </div>
    </section>
  </main>
  <script src="./core/md3.js"></script>
  <script src="./gfx/opener-scene.js"></script>
  <script src="./gfx/emblem-paths.js"></script>
  <script src="./gfx/opener.js"></script>
</body>
</html>
