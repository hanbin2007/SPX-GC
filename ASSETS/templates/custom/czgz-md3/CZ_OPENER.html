<!DOCTYPE html>
<html lang="zh-CN" class="cz-boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>常州高级中学 · 开场片头</title>
  <link rel="stylesheet" href="./core/md3.css">
  <link rel="stylesheet" href="./gfx/opener.css">
  <script>
    window.SPXGCTemplateDefinition = {
      description: "常高 M3 · 开场片头（约 35 秒，九场，按背景音乐卡点：1907 · 校园 · 日夜 · 宝塔 · 校名石 · 校徽 · 标版）",
      playserver: "-",
      playchannel: "1",
      playlayer: "50",
      webplayout: "5",
      steps: "1",
      out: "manual",
      dataformat: "json",
      uicolor: "6",
      DataFields: [
        { field: "f0", ftype: "textfield", title: "标题（可留空）", value: "2026年秋季学期开学典礼" },
        { field: "f1", ftype: "textfield", title: "副标题（可留空）", value: "2026年9月1日 · 学校体育馆" },
        {
          field: "f2", ftype: "dropdown", title: "结束方式", value: "reveal",
          items: [
            { text: "自动揭开直播画面", value: "reveal" },
            { text: "停在校徽画面（点收起再揭开）", value: "hold" }
          ]
        },
        {
          field: "f3", ftype: "dropdown", title: "背景音乐（动画按它的节拍剪辑）", value: "1",
          items: [
            { text: "开 · 音量 100%", value: "1" },
            { text: "开 · 音量 70%", value: "0.7" },
            { text: "开 · 音量 40%", value: "0.4" },
            { text: "关（静音，另行播放音乐时选这个）", value: "0" }
          ]
        },
        { ftype: "instruction", value: "盖在最上层（第 5 层）播放，播出时角标自动隐藏。OBS 里请在浏览器源属性勾选“通过 OBS 控制音频”，音乐才会进直播混音。“自动揭开”时片头结束后画面已回到直播，之后在 SPX 里点一下收起即可复位。中途点收起会立即揭开。" }
      ]
    };
  </script>
</head>
<body>
  <audio id="bgm" src="./media/opener-bgm.ogg" preload="auto"></audio>
  <main class="stage" id="stage">
    <!-- Trailing rims of the final reveal (under the cover). -->
    <i class="op-rim op-rim--soft" id="rimSoft" aria-hidden="true"></i>
    <i class="op-rim op-rim--teal" id="rimTeal" aria-hidden="true"></i>
    <section class="op" id="op" aria-label="开场片头">
      <!-- Background: monochrome campus photos, drifting motes -->
      <div class="op-bg" id="bg" aria-hidden="true">
        <div class="op-photo" id="photo"><b></b></div>
        <div class="op-motes" id="motes"></div>
      </div>
      <div class="op-deco" aria-hidden="true">
        <i class="op-halo"><b><u></u></b></i>
        <i class="op-clover"><b></b></i>
        <i class="op-sun8"><b></b></i>
        <i class="op-dot"><b></b></i>
        <i class="op-spark"><b></b></i>
        <i class="op-ring"><b></b></i>
        <i class="op-spark op-spark--sm"><b></b></i>
        <i class="op-pill"><b></b></i>
        <i class="op-cookie"><b></b></i>
      </div>
      <div class="op-ripples" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="op-rays" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="op-seed" id="seed"><i id="seedShape"></i></div>
      <i class="op-iris" id="iris" aria-hidden="true"></i>
      <div class="op-campus" id="campus">
        <div class="op-cam" id="cam"><i class="cz-wordmark op-stone-word" id="stoneWord"></i><i class="op-carve" id="carve"></i></div>
        <div class="op-year" id="year">
          <div class="op-year__in">
            <div class="cz-slot op-year__label" id="yearLabel"></div>
            <div class="op-year__digits" id="yearDigits"></div>
            <span class="op-year__range" id="yearRange"></span>
          </div>
        </div>
      </div>
      <div class="op-caption" id="caption">
        <i class="cz-spark"></i><span>CHANGZHOU SENIOR HIGH SCHOOL OF JIANGSU PROVINCE</span><i class="cz-spark"></i>
      </div>
      <!-- Scene 2: "SINCE 1907" -->
      <i class="op-s2rim op-s2rim--soft" id="s2rimSoft" aria-hidden="true"></i>
      <i class="op-s2rim op-s2rim--teal" id="s2rimTeal" aria-hidden="true"></i>
      <div class="op-s2" id="s2">
        <div class="op-s2__photo" aria-hidden="true"><b></b></div>
        <div class="op-s2__motes" id="s2motes" aria-hidden="true"></div>
        <div class="op-s2__in" id="s2in">
          <svg class="op-s2__ring" viewBox="-420 -420 840 840" aria-hidden="true"><path id="s2ring"/></svg>
          <div class="op-s2__deco" aria-hidden="true">
            <i class="op-s2__clover"><b></b></i><i class="op-s2__sun"><b></b></i>
            <i class="op-s2__spark"><b></b></i><i class="op-s2__cookie"><b></b></i>
          </div>
          <div class="op-s2__stack">
            <div class="op-s2__label" id="s2label">SINCE</div>
            <div class="op-s2__digits" id="s2digits"></div>
            <i class="cz-wordmark op-s2__word" id="s2word"></i>
            <div class="op-s2__en" id="s2en">CHANGZHOU SENIOR HIGH SCHOOL OF JIANGSU PROVINCE</div>
          </div>
        </div>
      </div>
      <!-- Scene-to-scene wipes inside the campus -->
      <div class="op-fx" aria-hidden="true">
        <div class="op-tiles" id="tiles"></div>
        <i class="op-door op-door--l" id="doorL"><b></b></i>
        <i class="op-door op-door--r" id="doorR"><b></b></i>
        <div class="op-curtain" id="curtain"></div>
      </div>
      <div class="op-warp" id="warp" aria-hidden="true"></div>
      <i class="op-moon" id="moonDisc" aria-hidden="true"></i>
      <div class="op-mark" id="mark">
        <div class="op-burst" id="burst" aria-hidden="true"></div>
        <div class="op-mark__float">
          <div class="op-orbit" id="orbit" aria-hidden="true">
            <svg class="op-orbit__dash" viewBox="-380 -380 760 760"><circle r="352"/></svg>
            <svg class="op-orbit__line" viewBox="-380 -380 760 760"><circle id="orbitLine" r="300" pathLength="1" transform="rotate(-90)"/></svg>
            <i class="op-arm op-arm--a"><b></b></i>
            <i class="op-arm op-arm--b"><b></b></i>
            <i class="op-arm op-arm--c"><b></b></i>
          </div>
          <div class="op-emblem" id="emblem"></div>
        </div>
      </div>
      <div class="op-lockup" id="lockup">
        <div class="op-lockup__in">
          <i class="cz-wordmark op-word" id="word"></i>
          <div class="op-en" id="en">CHANGZHOU SENIOR HIGH SCHOOL OF JIANGSU PROVINCE</div>
          <div class="op-rule" id="rule">
            <svg viewBox="0 0 544 20" aria-hidden="true"><path id="wave"/></svg>
          </div>
          <div class="op-title" id="title"></div>
          <div class="cz-slot op-sub" id="sub"></div>
          <div class="op-chip" id="chip"><i class="cz-spark"></i><span id="chipText"></span></div>
        </div>
      </div>
      <i class="op-sweep op-sweep--soft" id="sweepSoft" aria-hidden="true"></i>
      <i class="op-sweep" id="sweep" aria-hidden="true"></i>
    </section>
  </main>
  <script src="./core/md3.js"></script>
  <script src="./gfx/opener-scene.js"></script>
  <script src="./gfx/emblem-paths.js"></script>
  <script src="./gfx/opener.js"></script>
</body>
</html>
