<!DOCTYPE html>
<html lang="zh-CN">
<!--
  NEWSLINE · HEADLINE 标题条                         SPX web layer 3
  Scene slot "lower" (exclusive with NAME). Lifts above TICKER, steps aside
  for FULLSCREEN. Edits while on air switch in place. See README.md.
-->
<head>
  <meta charset="utf-8">
  <title>Newsline · 标题条</title>
  <link rel="stylesheet" href="./_scene/scene.css">
  <link rel="stylesheet" href="./_scene/lower.css">
  <script>
    window.SPXGCTemplateDefinition = {
      description: "Newsline 标题条 HEADLINE",
      playserver: "-",
      playchannel: "1",
      playlayer: "13",
      webplayout: "3",
      steps: "1",
      out: "manual",
      dataformat: "json",
      uicolor: "3",
      DataFields: [
        { field: "f1", ftype: "textfield", title: "标题", value: "城市更新计划发布，公共空间焕发新活力" },
        { field: "f2", ftype: "textfield", title: "补充信息（可留空）", value: "聚焦民生与城市发展" },
        { field: "f0", ftype: "textfield", title: "栏目", value: "要闻" },
        { field: "f3", ftype: "textfield", title: "地点（可留空）", value: "北京" },
        {
          field: "f4", ftype: "dropdown", title: "播出状态", value: "直播",
          items: [
            { text: "直播", value: "直播" },
            { text: "报道", value: "报道" },
            { text: "特别报道", value: "特别报道" },
            { text: "突发", value: "突发" }
          ]
        },
        { ftype: "instruction", value: "播出中修改任意字段后按 Update：画面原地切换，不会重新入场。与人名条同属下三分之一，互相接替。" }
      ]
    };
  </script>
</head>
<body>
  <main class="nl-stage" id="stage">
    <section class="nl-root lower lower--headline" id="root">
      <div class="nl-lift">
        <div class="lower-block">
          <div class="lower-tags">
            <div class="nl-chip nl-chip--signal" id="sectionChip"><span class="lower-text"><span class="nl-swap" id="section"></span></span></div>
            <div class="nl-chip nl-chip--ink lower-meta" id="metaChip">
              <i class="nl-live-dot"></i>
              <span class="lower-text"><span class="nl-swap" id="status"></span></span>
              <i class="nl-sep" id="metaSep"></i>
              <span class="lower-text"><span class="nl-swap" id="location"></span></span>
            </div>
          </div>
          <div class="lower-body">
            <i class="lower-bar"></i>
            <div class="lower-stack">
              <div class="lower-mainwrap">
                <div class="nl-shadow"></div>
                <i class="lower-line nl-pulse" id="line"></i>
                <div class="lower-main">
                  <span class="lower-text"><span class="nl-swap lower-title" id="headline"></span></span>
                </div>
              </div>
              <div class="lower-subwrap">
                <div class="lower-sub" id="subPlate">
                  <span class="lower-text"><span class="nl-swap lower-subtext" id="subline"></span></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="./_scene/scene.js"></script>
  <script>
    (function () {
      const N = window.Newsline;
      if (!N) return;                       // SPX template import (JSDOM) only reads the definition
      const $ = (id) => document.getElementById(id);
      const root = $("root");
      N.stage($("stage"));

      const MAX_TITLE = 1728 - 8 - 72;     // safe width − bar − plate padding
      let lastTitle = null;

      N.define({
        kind: "headline",
        slot: "lower",
        suspendOn: ["fullscreen"],
        root,
        enterMs: 960,
        exitMs: 520,
        defaults: {
          f0: "要闻",
          f1: "城市更新计划发布，公共空间焕发新活力",
          f2: "聚焦民生与城市发展",
          f3: "北京",
          f4: "直播"
        },
        lift: (env) => Math.max(0, env.reserveBottom + 22 - 72),
        render(d, ctx) {
          const animate = ctx.animate;
          const status = N.clean(d.f4) || "报道";
          const section = N.clean(d.f0);
          const location = N.clean(d.f3);
          const subline = N.clean(d.f2);

          root.classList.toggle("is-live", status === "直播" || status === "突发");
          root.classList.toggle("is-breaking", status === "突发");

          N.swap($("section"), section, { animate });
          $("sectionChip").classList.toggle("is-empty", !section);
          N.swap($("status"), status, { animate });
          N.swap($("location"), location, { animate });
          $("metaSep").classList.toggle("is-empty", !location);

          N.swap($("headline"), d.f1, { animate, fit: { max: MAX_TITLE, size: 54, min: 40 } });
          N.swap($("subline"), subline, { animate, fit: { max: MAX_TITLE, size: 30, min: 24 } });
          $("subPlate").classList.toggle("is-empty", !subline);

          const title = N.clean(d.f1);
          if (animate && (title !== lastTitle || ctx.fromCarry)) N.retrigger($("line"), "is-pulsing");
          lastTitle = title;
        }
      });
    })();
  </script>
</body>
</html>
